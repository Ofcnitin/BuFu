name = "bufu-api"
main = "src/index.ts"
compatibility_date = "2026-08-16"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "bufu-db-new"
database_id = "54557bd2-4c73-4617-ad88-f3563bb93e81"
migrations_dir = "migrations"

[vars]
# The person's real production origin (from their rebuild spec), plus a
# local-dev origin. Add any other origin (e.g. a custom domain) as a
# comma-separated entry here — never "*".
# "https://nitin.workers.dev" (previously here) matched nothing real: not
# this worker's own default workers.dev origin (that's
# bufu-api.ofcnitin.workers.dev, per this file's `name` + no custom
# route/domain below), not the GitHub Pages origin, not localhost. Replaced
# with the worker's actual own origin, kept alongside GitHub Pages so the
# API is reachable both when the frontend is served by GitHub Pages and
# when it's served by this same worker via [assets] below.
ALLOWED_ORIGINS = "https://ofcnitin.github.io,https://bufu-api.ofcnitin.workers.dev,http://localhost:5173"
ANILIST_URL = "https://graphql.anilist.co"
JIKAN_URL = "https://api.jikan.moe/v4"
KITSU_URL = "https://kitsu.io/api/edge"
SHIRO_URL = "https://shiro.kuuhaku.space"
MANGAUPDATES_URL = "https://api.mangaupdates.com/v1"
NYORA_BASE_URL = "https://api.hasanraza.tech"
# Comma-separated Nyora source IDs. These are source identifiers, not API keys.
# Reduce this list if you want fewer provider calls per search.
# NOTE: deliberately excludes "mangadex" — BuFu already has a first-class,
# verified MangaDex reader (adapters/mangadex.ts); nyora.ts's DEFAULT_SOURCES
# never registers a nyora:mangadex adapter at all, so including "mangadex"
# here would just be an inert, misleading entry.
NYORA_SOURCES = "bato,comick,mangafreak,mangaworld,asura,weebcentral,mangabuddy,mangapark,mangakakalot"

# Optional self-hosted/community reader backends. Leave unset to disable.
# They require URLs, not API keys.
# HACHI_URL = "https://your-hachi.example"
# COMIX_API_URL = "https://your-comix-api.example"
# MANGAFIRE_API_URL = "https://your-mangafire-api.example"
# MANGATO_API_URL = "https://your-mangato-api.example"
# MANGA_MAPPER_URL = "https://your-manga-mapper.example"
# MANGA_NOVEL_API_URL = "https://your-manga-novel-api.example"
# BATO_PARSER_URL = "https://your-bato-parser-wrapper.example"

# MANGADEX_ACCESS_TOKEN is a SECRET, not a var — never put it here.
# Set it with: wrangler secret put MANGADEX_ACCESS_TOKEN
# It is optional: MangaDex's read endpoints used by BUFU (search, manga
# detail, feed, at-home) all work unauthenticated per their public docs;
# the token is only for higher-trust/account-scoped calls BUFU doesn't
# currently make. Never required for the app to function.

[triggers]
# Handled by the scheduled() export in src/index.ts: probes configured
# source health and prunes expired sessions / rate-limit buckets. Does NOT
# bulk-poll chapter data — see orchestrator.ts for why.
crons = ["*/15 * * * *"]

[assets]
directory = "../frontend"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]
